name: Unity compile + EditMode tests (manual)

# Manual-only: this workflow needs a one-time Unity licence secret before it
# can run (see docs/FINISH_AUDIT_2026-11-05.md). It does not run on push, so
# it never fails noisily while the secret is missing.
#
# One-time setup (repo owner), per https://game.ci/docs/github/activation:
#   1. Install Unity Hub on your PC, log in, then Preferences > Licenses >
#      Add > "Get a free personal license". This creates Unity_lic.ulf at
#      C:\ProgramData\Unity\Unity_lic.ulf (Windows).
#   2. Settings > Secrets and variables > Actions: add UNITY_LICENSE (the
#      whole contents of that .ulf file), UNITY_EMAIL, UNITY_PASSWORD.
#   3. Run this workflow from the Actions tab ("Run workflow").
#
# What it does: checks out the pinned NeuralCourt submodule, installs the
# showcase overlay with tools/Install-ShowcasePatch.sh, then compiles every
# script (overlay + upstream) in the real Unity 6000.5.3f1 editor and runs
# the upstream EditMode tests. A green run is a real Unity compile — it is
# still not a Play Mode / visual-quality verdict.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unity-editmode:
    name: Unity 6000.5.3f1 compile + EditMode tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source with pinned submodule
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Install showcase overlay into NeuralCourt
        run: bash tools/Install-ShowcasePatch.sh

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: NeuralCourt/Library
          key: Library-NeuralCourt-6000.5.3f1-v1
          restore-keys: |
            Library-NeuralCourt-

      - name: Compile and run EditMode tests in Unity
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: NeuralCourt
          unityVersion: 6000.5.3f1
          testMode: EditMode
          artifactsPath: unity-test-results
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unity-editmode-results
          path: unity-test-results
