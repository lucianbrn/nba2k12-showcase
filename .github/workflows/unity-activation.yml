name: Unity licence setup (instructions)

# DEPRECATED approach — kept only as a signpost. The old GameCI activation
# action (unity-request-activation-file) was retired by GameCI; run #1 of
# this workflow failed on 2026-11-05 with "This action is no longer
# supported." The current Personal-licence method needs no workflow:
#
#   1. Install Unity Hub on your PC and log in with your Unity account.
#   2. Unity Hub > Preferences > Licenses > Add > "Get a free personal
#      license". This creates C:\ProgramData\Unity\Unity_lic.ulf.
#   3. In this repo (Settings > Secrets and variables > Actions) add:
#      UNITY_LICENSE  = full contents of that .ulf file
#      UNITY_EMAIL    = your Unity account email
#      UNITY_PASSWORD = your Unity account password
#   4. Run the "Unity compile + EditMode tests (manual)" workflow.
#
# Full docs: https://game.ci/docs/github/activation
# Running this workflow just prints these instructions and succeeds.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instructions:
    name: Print current licence setup instructions
    runs-on: ubuntu-latest
    steps:
      - name: Instructions
        run: |
          echo "GameCI retired the .alf activation action. Use Unity Hub instead:"
          echo "1) Unity Hub > Preferences > Licenses > Add > Get a free personal license"
          echo "2) Take C:\\ProgramData\\Unity\\Unity_lic.ulf (Windows)"
          echo "3) Add repo secrets UNITY_LICENSE (.ulf contents), UNITY_EMAIL, UNITY_PASSWORD"
          echo "4) Run the 'Unity compile + EditMode tests (manual)' workflow"
          echo "Docs: https://game.ci/docs/github/activation"
